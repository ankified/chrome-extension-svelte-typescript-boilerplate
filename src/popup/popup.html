<!DOCTYPE html>
<html lang="pt-BR" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Extensor de Navegador</title>
        <style>
            /* Definir dimensões fixas para o popup */
            html, body {
                width: 400px;
                height: 500px;
                overflow: hidden;
                margin: 0;
                padding: 0;
            }

            /* Garantir que o conteúdo não ultrapasse as dimensões fixas */
            #app {
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
        </style>
    </head>
    <body class="dark:bg-gray-900">
        <div id="app"></div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
